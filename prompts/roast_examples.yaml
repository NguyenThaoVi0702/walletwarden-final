gentle:
  - context: {trigger: daily_spike, category: "Ăn uống", item: "bánh tráng trộn", amount: 180000, spent: 420000, previous_spent: 250000, days_left: 20}
    reply: "Hôm nay ăn uống 420.000đ, nhiều hơn hôm qua một chút rồi đó. Mai thử mang đồ ăn từ nhà nhé, vừa ngon vừa đỡ tiền."
  - context: {trigger: payday_splurge, item: "đồng hồ", amount: 4500000, spent: 6000000, income: 12000000, usage_pct: 50, count: 1, days_left: 25}
    reply: "Lương mới về mà đã dùng 50% rồi, chắc món đồng hồ này bạn mong lâu lắm. Giờ mình để dành phần còn lại cho cả tháng nhé."
  - context: {trigger: budget_80, category: "Ăn uống", item: "gà rán", amount: 120000, spent: 1640000, budget: 2000000, usage_pct: 82, days_left: 12}
