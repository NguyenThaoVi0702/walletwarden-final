# Automated checks on every push and pull request (plan §8.2 step 4).
# A PR can be merged only when every job below is green (branch protection).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ------------------------------------------------------------------ which tracks changed?
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'prompts/**'
              - 'scripts/**'
              - 'llm/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'backend/openapi.json'
              - '.github/workflows/**'
            contract:
              - 'backend/app/schemas/**'
              - 'backend/app/ai/interface.py'
              - 'backend/openapi.json'

  # ------------------------------------------------------------------ PR hygiene (all members)
  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -Eq '^(feat|fix|docs|test|refactor|chore|ci|perf|style|build)(\([a-z0-9-]+\))?!?: .{3,}$'; then
            echo "::error::PR title must look like 'feat(ai): add roast prompts' (Conventional Commits). Got: $TITLE"
            exit 1
          fi
      - name: Branch name and target branch
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "develop" ] && ! echo "$HEAD" | grep -Eq '^hotfix/'; then
              echo "::error::Only 'develop' (milestone release) or 'hotfix/*' may be merged into main."
              exit 1
            fi
          elif ! echo "$HEAD" | grep -Eq '^(feature|fix|docs|test|chore|refactor)/[a-z0-9._-]+$'; then
            echo "::error::Branch '$HEAD' must be named feature/..., fix/..., docs/..., test/..., chore/... (lowercase, dashes)."
            exit 1
          fi

  # ------------------------------------------------------------------ frozen contracts (M1)
  contract-guard:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Contract changes need approval from all three members
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'contract-approved') }}
        run: |
          # Contracts are frozen from 31 Oct 2026 (plan §6.3).
          if [ "$(date -u +%Y%m%d)" -lt 20261031 ]; then echo "Before freeze, OK"; exit 0; fi
          if [ "$APPROVED" != "true" ]; then
            echo "::error::This PR changes a shared contract (schemas, openapi.json or ai/interface.py)."
            echo "::error::Agree it with all three members, record it in the minutes, then add the label 'contract-approved'."
            exit 1
          fi

  # ------------------------------------------------------------------ backend + AI (Khải, Vi)
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check . ../scripts ../llm --output-format=github
      - name: Ruff format
        run: uv run ruff format --check . ../scripts ../llm
      - name: mypy (strict)
        run: uv run mypy app
      - name: pytest (AI runs on the simulated provider, no GPU needed)
        env:
          WW_AI_PROVIDERS: fake
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Coverage of business logic >= 70% (app/services)
        run: |
          if ls app/services/*.py 2>/dev/null | grep -vq '__init__.py'; then
            uv run coverage report --include='app/services/*' --fail-under=70
          else
            echo "No services yet, skipping."
          fi
      - name: OpenAPI contract is up to date
        run: |
          uv run python -m app.export_openapi
          if [ -n "$(git status --porcelain openapi.json)" ]; then
            git --no-pager diff openapi.json | head -60
            echo "::error::backend/openapi.json is out of date. Run 'uv run python -m app.export_openapi' and commit it."
            exit 1
          fi

  # ------------------------------------------------------------------ frontend (Tùng)
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Frontend exists?
        id: exists
        working-directory: .
        run: echo "yes=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.exists.outputs.yes == 'true'
        run: npm ci
      - name: Types generated from OpenAPI match the backend
        if: steps.exists.outputs.yes == 'true'
        run: |
          npm run gen:api
          if [ -n "$(git status --porcelain src/api)" ]; then
            git --no-pager diff src/api | head -60
            echo "::error::src/api/schema.d.ts differs from backend/openapi.json. Run 'npm run gen:api' and commit."
            exit 1
          fi
      - if: steps.exists.outputs.yes == 'true'
        run: npm run lint
      - if: steps.exists.outputs.yes == 'true'
        run: npm run typecheck
      - if: steps.exists.outputs.yes == 'true'
        run: npm run test -- --run
      - if: steps.exists.outputs.yes == 'true'
        run: npm run build

  # ------------------------------------------------------------------ no secrets in the repo
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
