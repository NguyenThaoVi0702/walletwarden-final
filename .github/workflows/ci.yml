# Automated checks on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ------------------------------------------------------------------ which tracks changed?
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'prompts/**'
              - 'scripts/**'
              - 'llm/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'backend/openapi.json'
              - '.github/workflows/**'

  # ------------------------------------------------------------------ backend + AI
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check . ../scripts ../llm --output-format=github
      - name: Ruff format
        run: uv run ruff format --check . ../scripts ../llm
      - name: mypy (strict)
        run: uv run mypy app
      - name: pytest (AI runs on the simulated provider, no GPU needed)
        env:
          WW_AI_PROVIDERS: fake
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Coverage of business logic >= 70% (app/services)
        run: |
          if ls app/services/*.py 2>/dev/null | grep -vq '__init__.py'; then
            uv run coverage report --include='app/services/*' --fail-under=70
          else
            echo "No services yet, skipping."
          fi
      - name: OpenAPI contract is up to date
        run: |
          uv run python -m app.export_openapi
          if [ -n "$(git status --porcelain openapi.json)" ]; then
            git --no-pager diff openapi.json | head -60
            echo "::error::backend/openapi.json is out of date. Run 'uv run python -m app.export_openapi' and commit it."
            exit 1
          fi

  # ------------------------------------------------------------------ frontend
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Frontend exists?
        id: exists
        working-directory: .
        run: echo "yes=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.exists.outputs.yes == 'true'
        run: npm ci
      - name: Types generated from OpenAPI match the backend
        if: steps.exists.outputs.yes == 'true'
        run: |
          npm run gen:api
          if [ -n "$(git status --porcelain src/api)" ]; then
            git --no-pager diff src/api | head -60
            echo "::error::src/api/schema.d.ts differs from backend/openapi.json. Run 'npm run gen:api' and commit."
            exit 1
          fi
      - if: steps.exists.outputs.yes == 'true'
        run: npm run lint
      - if: steps.exists.outputs.yes == 'true'
        run: npm run typecheck
      - if: steps.exists.outputs.yes == 'true'
        run: npm run test -- --run
      - if: steps.exists.outputs.yes == 'true'
        run: npm run build

  # ------------------------------------------------------------------ no secrets in the repo
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
