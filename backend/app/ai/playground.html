<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Playground</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c1f24; --muted: #667085; --border: #dde1e7;
    --accent: #0f766e; --accent-soft: #e6f4f2; --user: #eef2ff; --warn: #b54708; --warn-soft: #fff4e5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #1a1e24; --text: #e6e8eb; --muted: #98a2b3; --border: #2c323b;
      --accent: #2dd4bf; --accent-soft: #10302d; --user: #232a3d; --warn: #f5a524; --warn-soft: #33270f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  h1 { font-size: 18px; margin: 0; }
  #health { font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 10px; }
  nav { display: flex; gap: 4px; padding: 12px 16px 0; flex-wrap: wrap; }
  nav button { border: 1px solid var(--border); border-bottom: none; background: transparent; color: var(--muted);
    padding: 8px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font: inherit; }
  nav button.on { background: var(--panel); color: var(--text); font-weight: 600; }
  main { max-width: 1100px; padding: 0 16px 32px; }
  section { display: none; background: var(--panel); border: 1px solid var(--border);
    border-radius: 0 8px 8px 8px; padding: 16px; }
  section.on { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 760px) { section.on { grid-template-columns: minmax(0, 1fr); } }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  select, input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; }
  textarea { font: 12.5px/1.45 ui-monospace, Consolas, monospace; min-height: 300px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .btn { margin-top: 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .btn { color: #0b1f1d; } }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); margin-left: 6px; }
  .chat { display: flex; flex-direction: column; gap: 8px; min-height: 200px; max-height: 480px; overflow-y: auto;
    padding: 4px; }
  .msg { padding: 10px 12px; border-radius: 10px; max-width: 92%; white-space: pre-wrap; }
  .msg.user { background: var(--user); align-self: flex-end; }
  .msg.ai { background: var(--accent-soft); align-self: flex-start; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .meta b.fb { color: var(--warn); }
  .err { background: var(--warn-soft); color: var(--warn); padding: 10px 12px; border-radius: 8px; }
  .out { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; }
  .out h3 { margin: 0 0 6px; font-size: 16px; }
  .hint { font-size: 13px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chips button { font: inherit; font-size: 13px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>WalletWarden · AI Playground</h1>
  <span id="health">đang kiểm tra model…</span>
</header>
<nav>
  <button data-tab="auto" class="on">Roast tự động</button>
  <button data-tab="advice">Cố vấn (F6)</button>
  <button data-tab="roast">Roast thủ công (F7)</button>
  <button data-tab="report">Báo cáo tháng (F8)</button>
  <button data-tab="entry">Nhập nhanh (F9)</button>
</nav>
<main>
  <!-- AUTO ROAST -->
  <section id="auto" class="on">
    <div>
      <label>Kịch bản đáng bị chửi (bấm để chạy)</label>
      <div class="chips" id="au-scenarios"></div>
      <div class="row">
        <div><label>Giọng</label>
          <select id="au-tone"><option value="savage">savage – cà khịa cực gắt</option><option value="honest">honest – thẳng thắn</option><option value="gentle">gentle – nhẹ nhàng</option></select></div>
        <div><label>Ngày giao dịch</label><input id="au-day" type="date" value="2026-11-14"></div>
        <div><label>Ngân sách tổng tháng (đ)</label><input id="au-total" type="number" value="6000000"></div>
        <div><label>Danh mục (trống = AI tự chọn)</label><select id="au-cat"><option value="">— AI tự chọn —</option></select></div>
      </div>
      <label>Ngân sách theo danh mục (JSON)</label>
      <input id="au-budgets" value='{"Ăn uống": 2500000, "Mua sắm": 1500000, "Giải trí": 800000}'>
      <label>Gõ giao dịch như trên điện thoại</label>
      <input id="au-text" placeholder="ăn lẩu 250k">
      <button class="btn" id="au-send">Lưu giao dịch</button><button class="btn ghost" id="au-reset">Xoá lịch sử</button>
      <label>Lịch sử giao dịch (35 ngày)</label>
      <div id="au-history" class="hint">Chưa có giao dịch.</div>
    </div>
    <div><label>Thông báo roast</label><div id="au-out" class="chat"><div class="hint">Lưu giao dịch, hệ thống tự quyết định có chửi không.</div></div></div>
  </section>

  <!-- ADVICE -->
  <section id="advice">
    <div>
      <label>Hồ sơ số liệu (từ bộ test, sửa JSON thoải mái)</label>
      <select id="adv-preset"></select>
      <label>FinancialSummary</label>
      <textarea id="adv-summary"></textarea>
    </div>
    <div>
      <label>Hội thoại</label>
      <div class="chat" id="adv-chat"><div class="hint">Hỏi gì đó về chi tiêu tháng này…</div></div>
      <div class="chips" id="adv-samples"></div>
      <label>Câu hỏi</label>
      <input id="adv-q" placeholder="Mình có đủ tiền mua tai nghe 2 triệu không?">
      <button class="btn" id="adv-send">Gửi</button><button class="btn ghost" id="adv-clear">Xoá hội thoại</button>
    </div>
  </section>

  <!-- ROAST -->
  <section id="roast">
    <div>
      <label>Case mẫu</label>
      <select id="ro-preset"></select>
      <div class="row">
        <div><label>Trigger</label>
          <select id="ro-trigger"><option>budget_80</option><option>budget_100</option><option>large_expense</option></select></div>
        <div><label>Giọng</label>
          <select id="ro-tone"><option value="gentle">gentle – nhẹ nhàng</option><option value="honest">honest – thẳng thắn</option><option value="savage">savage – cà khịa</option></select></div>
        <div><label>Danh mục (trống = cả tháng)</label><input id="ro-category"></div>
        <div><label>Khoản vừa chi (đ)</label><input id="ro-amount" type="number"></div>
        <div><label>Đã chi trong phạm vi (đ)</label><input id="ro-spent" type="number"></div>
        <div><label>Ngân sách (đ)</label><input id="ro-budget" type="number"></div>
        <div><label>% đã dùng</label><input id="ro-usage" type="number"></div>
        <div><label>Chi trung bình/lần (đ)</label><input id="ro-avg" type="number"></div>
        <div><label>Số ngày còn lại</label><input id="ro-days" type="number"></div>
      </div>
      <button class="btn" id="ro-send">Roast!</button>
      <button class="btn ghost" id="ro-all">Thử cả 3 giọng</button>
    </div>
    <div><label>Kết quả</label><div id="ro-out" class="chat"></div></div>
  </section>

  <!-- REPORT -->
  <section id="report">
    <div>
      <label>Hồ sơ số liệu</label>
      <select id="rep-preset"></select>
      <label>FinancialSummary</label>
      <textarea id="rep-summary"></textarea>
      <button class="btn" id="rep-send">Tạo báo cáo</button>
    </div>
    <div><label>Báo cáo</label><div id="rep-out"></div></div>
  </section>

  <!-- QUICK ENTRY -->
  <section id="entry">
    <div>
      <label>Gõ giao dịch như trên điện thoại</label>
      <input id="en-text" placeholder="trà sữa 45k">
      <div class="chips" id="en-samples"></div>
      <button class="btn" id="en-send">Phân tích</button>
      <p class="hint">Số tiền do code đọc (không phải model); model chỉ chọn thu/chi, danh mục và ghi chú.</p>
    </div>
    <div><label>Kết quả</label><div id="en-out" class="chat"></div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const vnd = (n) => n == null ? "–" : n.toLocaleString("vi-VN") + "đ";
let P = null, history = [];

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button, section").forEach((x) => x.classList.remove("on"));
  b.classList.add("on"); $(b.dataset.tab).classList.add("on");
});

async function call(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail ?? data, null, 1));
  return data;
}
function meta(r) {
  const fb = r.fallback ? ' · <b class="fb">fallback</b>' : "";
  const ms = r.latency_ms != null ? ` · ${(r.latency_ms / 1000).toFixed(2)} s` : "";
  return `<div class="meta">${r.provider}${ms}${fb}</div>`;
}
function bubble(box, cls, html) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html;
  box.querySelector(".hint")?.remove(); box.appendChild(d); box.scrollTop = box.scrollHeight; return d;
}
function errBox(box, e) { const d = document.createElement("div"); d.className = "err"; d.textContent = e.message; box.appendChild(d); }
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
async function busy(btn, fn) { btn.disabled = true; try { await fn(); } finally { btn.disabled = false; } }
function parseSummary(id) { return JSON.parse($(id).value); }

async function health() {
  try {
    const h = await (await fetch("/health")).json();
    $("health").innerHTML = "Chuỗi provider: <b>" + h.chain.join(" → ") + "</b>" +
      Object.entries(h.providers).map(([k, ok]) =>
        `<span class="dot" style="background:${ok ? "#12b76a" : "#f04438"}"></span>${k}`).join("");
  } catch { $("health").textContent = "Không gọi được /health"; }
}

async function init() {
  P = await (await fetch("/presets")).json();
  for (const sel of ["adv-preset", "rep-preset"]) {
    $(sel).innerHTML = Object.keys(P.summaries).map((k) => `<option>${k}</option>`).join("");
  }
  const fill = (sel, ta) => { $(ta).value = JSON.stringify(P.summaries[$(sel).value], null, 2); };
  $("adv-preset").onchange = () => { fill("adv-preset", "adv-summary"); renderSamples(); };
  $("rep-preset").onchange = () => fill("rep-preset", "rep-summary");
  fill("adv-preset", "adv-summary"); fill("rep-preset", "rep-summary"); renderSamples();

  $("ro-preset").innerHTML = Object.entries(P.roasts).map(([id, c]) =>
    `<option value="${id}">${id} · ${c.trigger} · ${c.tone} · ${c.category ?? "cả tháng"}</option>`).join("");
  $("ro-preset").onchange = loadRoast; loadRoast();

  $("en-samples").innerHTML = ["trà sữa 45k", "nhận lương tháng 11 8tr", "grab đi làm 1tr2", "đóng tiền điện 650.000", "mua sách 120 nghìn"]
    .map((t) => `<button>${t}</button>`).join("");
  $("en-samples").querySelectorAll("button").forEach((b) => b.onclick = () => { $("en-text").value = b.textContent; $("en-send").click(); });
}

function renderSamples() {
  const qs = P.questions.filter((q) => q.summary === $("adv-preset").value);
  $("adv-samples").innerHTML = qs.map((q) => `<button title="${q.id}">${esc(q.question)}</button>`).join("");
  $("adv-samples").querySelectorAll("button").forEach((b) => b.onclick = () => { $("adv-q").value = b.textContent; $("adv-send").click(); });
}

// ---- advice
$("adv-send").onclick = () => busy($("adv-send"), async () => {
  const q = $("adv-q").value.trim(); if (!q) return;
  const box = $("adv-chat"); bubble(box, "user", esc(q)); $("adv-q").value = "";
  try {
    const r = await call("/advice", { summary: parseSummary("adv-summary"), question: q, history: history.slice(-6) });
    bubble(box, "ai", esc(r.text) + meta(r));
    history.push({ role: "user", content: q }, { role: "assistant", content: r.text });
  } catch (e) { errBox(box, e); }
});
$("adv-q").onkeydown = (e) => { if (e.key === "Enter") $("adv-send").click(); };
$("adv-clear").onclick = () => { history = []; $("adv-chat").innerHTML = '<div class="hint">Đã xoá. Hỏi tiếp nhé…</div>'; };

// ---- roast
const RO = { trigger: "ro-trigger", tone: "ro-tone", category: "ro-category", amount: "ro-amount", spent: "ro-spent",
  budget: "ro-budget", usage_pct: "ro-usage", average_expense: "ro-avg", days_left: "ro-days" };
function loadRoast() { const c = P.roasts[$("ro-preset").value]; for (const [k, id] of Object.entries(RO)) $(id).value = c[k] ?? ""; }
function roastCtx(tone) {
  const c = {};
  for (const [k, id] of Object.entries(RO)) {
    const v = $(id).value.trim(); if (v === "") continue;
    c[k] = ["trigger", "tone", "category"].includes(k) ? v : Number(v);
  }
  if (tone) c.tone = tone; return c;
}
async function doRoast(tone) {
  const box = $("ro-out"), ctx = roastCtx(tone);
  try { const r = await call("/roast", ctx); bubble(box, "ai", `<b>${ctx.tone}</b> · ${$("ro-preset").value}\n` + esc(r.text) + meta(r)); }
  catch (e) { errBox(box, e); }
}
$("ro-send").onclick = () => busy($("ro-send"), () => doRoast());
$("ro-all").onclick = () => busy($("ro-all"), () => Promise.all(["gentle", "honest", "savage"].map(doRoast)));

// ---- report
$("rep-send").onclick = () => busy($("rep-send"), async () => {
  const out = $("rep-out"); out.innerHTML = '<div class="hint">Đang viết báo cáo…</div>';
  try {
    const r = await call("/report", parseSummary("rep-summary"));
    out.innerHTML = `<div class="out"><h3>${esc(r.headline)}</h3>${esc(r.commentary)}\n\n<b>Mẹo:</b> ${esc(r.saving_tip)}` +
      `\n\n<b>Top danh mục:</b> ${r.top_categories.map((c) => `${c.name} ${vnd(c.spent)}`).join(", ") || "–"}` + meta(r) + "</div>";
  } catch (e) { out.innerHTML = ""; errBox(out, e); }
});

// ---- quick entry
$("en-send").onclick = () => busy($("en-send"), async () => {
  const t = $("en-text").value.trim(); if (!t) return;
  const box = $("en-out");
  try {
    const r = await call("/entry", { text: t });
    bubble(box, "ai", `<b>${esc(t)}</b>\n${r.kind === "income" ? "Thu" : "Chi"} · ${vnd(r.amount)} · ${esc(r.category)}\nGhi chú: ${esc(r.note)}<div class="meta">${r.provider}</div>`);
  } catch (e) { errBox(box, e); }
});
$("en-text").onkeydown = (e) => { if (e.key === "Enter") $("en-send").click(); };

// ---- auto roast
let txs = [], fired = [];
const TRIGGER_VI = {
  budget_80: "Vượt 80% ngân sách", budget_100: "Vượt 100% ngân sách", large_expense: "Khoản chi lớn bất thường",
  daily_spike: "Hôm nay tiêu hơn hẳn hôm qua", repeat_today: "Mua lần thứ 3+ trong ngày", small_habit: "Tiền lặt vặt cộng dồn",
  spending_streak: "Tiêu nhiều ngày liên tiếp", payday_splurge: "Lương về là tiêu", over_income: "Chi vượt thu nhập",
  burn_rate: "Tốc độ này sẽ cháy túi trước cuối tháng",
};
const shift = (iso, d) => { const x = new Date(iso + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + d); return x.toISOString().slice(0, 10); };
const T = (amount, category, ago, kind = "expense") => ({ kind, amount, category, day: shift($("au-day").value, -ago) });
// Each scenario: earlier transactions, then the one the user "types" that should trigger the roast.
const SCENARIOS = [
  { name: "Hôm qua ăn 300k, hôm nay 500k", seed: () => [T(300000, "Ăn uống", 1), T(250000, "Ăn uống", 0)], text: "lẩu tối 250k", cat: "Ăn uống" },
  { name: "Ly trà sữa thứ 3 trong ngày", seed: () => [T(45000, "Ăn uống", 0), T(50000, "Ăn uống", 0)], text: "trà sữa 45k", cat: "Ăn uống" },
  { name: "Lương về 2 ngày đã bay 43%", seed: () => [T(10000000, "Lương", 2, "income"), T(2800000, "Mua sắm", 1)], text: "mua giày 1tr5", cat: "Mua sắm" },
  { name: "Mua sắm 4 ngày liền", seed: () => [1, 2, 3].map((d) => T(150000, "Mua sắm", d)), text: "áo thun 150k", cat: "Mua sắm" },
  { name: "8 ly cà phê lặt vặt", seed: () => [1, 2, 3, 4, 5, 6, 7].map((d) => T(45000, "Ăn uống", d)), text: "cà phê 45k", cat: "Ăn uống" },
  { name: "Chi vượt cả thu nhập", seed: () => [T(4000000, "Lương", 13, "income"), T(3900000, "Mua sắm", 5)], text: "ăn tối 200k", cat: "Ăn uống" },
  { name: "Ngân sách ăn uống chạm 80%", seed: () => [T(1900000, "Ăn uống", 3)], text: "nhà hàng 150k", cat: "Ăn uống" },
  { name: "Giải trí vượt 100%", seed: () => [T(700000, "Giải trí", 4)], text: "vé concert 350k", cat: "Giải trí" },
  { name: "Tốc độ đốt tiền", seed: () => [T(3400000, "Khác", 5)], text: "linh tinh 100k", cat: "Khác" },
  { name: "Khoản lớn bất thường", seed: () => [1, 2, 3, 4, 5].map((d) => T(80000, "Ăn uống", d)), text: "tai nghe 900k", cat: "Mua sắm" },
];

function renderHistory() {
  if (!txs.length) { $("au-history").innerHTML = "Chưa có giao dịch."; return; }
  $("au-history").innerHTML = [...txs].sort((a, b) => a.day.localeCompare(b.day)).map((t) =>
    `${t.day.slice(8)}/${t.day.slice(5, 7)} · ${t.kind === "income" ? "Thu" : "Chi"} ${vnd(t.amount)} · ${esc(t.category)}`).join("<br>");
}
async function saveTx(text, cat) {
  const box = $("au-out");
  bubble(box, "user", esc(text) + (cat ? ` <span class="meta">(${esc(cat)})</span>` : ""));
  try {
    const r = await call("/simulate", {
      text, day: $("au-day").value, tone: $("au-tone").value, category: cat || null, history: txs,
      budgets: JSON.parse($("au-budgets").value || "{}"), total_budget: Number($("au-total").value) || null, fired,
    });
    txs.push(r.tx); renderHistory();
    if (r.roast) {
      fired.push(r.key);
      bubble(box, "ai", `<b>🔔 ${TRIGGER_VI[r.trigger] ?? r.trigger}</b>\n` + esc(r.roast.text) + meta(r.roast));
    } else {
      bubble(box, "ai", `<span class="meta">Đã lưu ${vnd(r.tx.amount)} · ${esc(r.tx.category)}. Không có gì đáng chửi.</span>`);
    }
  } catch (e) { errBox(box, e); }
}
$("au-send").onclick = () => busy($("au-send"), async () => {
  const t = $("au-text").value.trim(); if (!t) return; $("au-text").value = ""; await saveTx(t, $("au-cat").value);
});
$("au-text").onkeydown = (e) => { if (e.key === "Enter") $("au-send").click(); };
$("au-reset").onclick = () => { txs = []; fired = []; renderHistory(); $("au-out").innerHTML = '<div class="hint">Đã xoá lịch sử.</div>'; };
function initAuto() {
  $("au-cat").innerHTML += P.categories.map((c) => `<option>${c}</option>`).join("");
  $("au-scenarios").innerHTML = SCENARIOS.map((s, i) => `<button data-i="${i}">${s.name}</button>`).join("");
  $("au-scenarios").querySelectorAll("button").forEach((b) => b.onclick = () => busy(b, async () => {
    const s = SCENARIOS[b.dataset.i];
    txs = s.seed(); fired = []; renderHistory();
    $("au-out").innerHTML = `<div class="hint">Kịch bản: ${s.name}. Đã nạp ${txs.length} giao dịch trước đó.</div>`;
    await saveTx(s.text, s.cat);
  }));
}

health(); init().then(initAuto);
</script>
</body>
</html>
